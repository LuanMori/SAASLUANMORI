<!DOCTYPE html>
<!--/* Os ícones das telas antigas, iguais (SVG embutido, traço que herda a cor do texto). Fontes: legacy/web/src/Logo.tsx,
       BotaoTema.tsx, telas/TelaEntrada.tsx:196-236, telas/LayoutEntrada.tsx:67-102 e painel/menu.tsx:36-182. */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* a logo provisória do SaaS (Logo.tsx) */-->
<span th:fragment="logo(tamanho)" th:class="'logo logo-' + ${tamanho}"><svg class="logo-simbolo" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect width="48" height="48" rx="12" fill="currentColor"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 19 14.5 11h19l3 8"/><path d="M11.5 19c0 2.1 1.6 3.8 3.6 3.8s3.6-1.7 3.6-3.8c0 2.1 1.6 3.8 3.6 3.8h3.4c2 0 3.6-1.7 3.6-3.8 0 2.1 1.6 3.8 3.6 3.8s3.6-1.7 3.6-3.8"/><path d="M14 24v13h20V24M21 37v-7h6v7"/></g></svg><span class="logo-nome" th:text="${T(com.saasluanmori.web.Marca).NOME}">Nome da empresa</span></span>

<!--/* o botão do tema (BotaoTema.tsx): mostra a lua no claro; tema.js troca para o sol no escuro */-->
<button th:fragment="botaoTema(classe)" type="button" th:class="${classe}" data-botao-tema aria-label="Usar o tema escuro" title="Tema escuro"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>

<!--/* tela de entrada (TelaEntrada.tsx:196-236) */-->
<svg th:fragment="usuario" class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
<svg th:fragment="cadeado" class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="10" width="15" height="11" rx="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="0.6" fill="currentColor"/></svg>
<svg th:fragment="olhoFechado" class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10c2.4 3 5.4 4.5 9 4.5S18.6 13 21 10"/><path d="M6 13l-1.5 2M12 14.5V17M18 13l1.5 2"/></svg>
<svg th:fragment="olhoAberto" class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
<svg th:fragment="fone" class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13.5" width="4" height="6" rx="2"/><rect x="17" y="13.5" width="4" height="6" rx="2"/><path d="M19 19.5v.5a2 2 0 0 1-2 2h-3.5"/></svg>

<!--/* molde da entrada (LayoutEntrada.tsx:67-102) */-->
<svg th:fragment="lojaPequena" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9.5 5.6 5h12.8L20 9.5"/><path d="M4 9.5c0 1.2.9 2.1 2 2.1s2-.9 2-2.1c0 1.2.9 2.1 2 2.1h4c1.1 0 2-.9 2-2.1 0 1.2.9 2.1 2 2.1s2-.9 2-2.1"/><path d="M5.5 12.5V19h13v-6.5M10 19v-4h4v4"/></svg>
<svg th:fragment="recurso(icone)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><th:block th:if="${icone == 'pdv'}"><rect x="4" y="9.5" width="16" height="10" rx="1.6"/><path d="M7.5 9.5V4.5h9v5M8 13h2M11 13h2M14 13h2M8 16h8"/></th:block><th:block th:if="${icone == 'estoque'}"><path d="M12 3.5 20 8v8l-8 4.5L4 16V8Z"/><path d="M4 8l8 4.5L20 8M12 12.5v8"/></th:block><th:block th:if="${icone == 'financeiro'}"><path d="M4 20h16"/><rect x="5.5" y="12.5" width="3" height="5" rx="0.8"/><rect x="10.5" y="8.5" width="3" height="9" rx="0.8"/><rect x="15.5" y="4.5" width="3" height="13" rx="0.8"/></th:block></svg>

<!--/* barra lateral (menu.tsx:36-182) */-->
<svg th:fragment="menu(id)" class="barra-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><th:block th:switch="${id}"><th:block th:case="'visao-geral'"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></th:block><th:block th:case="'frente-de-caixa'"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/></th:block><th:block th:case="'caixa-do-dia'"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></th:block><th:block th:case="'produtos-e-estoque'"><path d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></th:block><th:block th:case="'compras'"><path d="M14 17V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11h2M14 9h4l3 3.5V17h-2M9 17h6"/><circle cx="7" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></th:block><th:block th:case="'clientes'"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M15.5 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></th:block><th:block th:case="'financeiro'"><path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20.5h18"/></th:block><th:block th:case="'relatorios'"><path d="M4 4v16h16M8.5 16v-4M13 16V8M17.5 16v-6"/></th:block><th:block th:case="'dados-e-backup'"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></th:block><th:block th:case="'usuarios'"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6z"/><circle cx="12" cy="10" r="2.3"/><path d="M8.6 16c.7-1.5 1.9-2.3 3.4-2.3s2.7.8 3.4 2.3"/></th:block><th:block th:case="'suporte'"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.6"/><path d="M12 17h.01"/></th:block><th:block th:case="'meu-usuario'"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.7 18.3c1.2-2 3.1-3.1 5.3-3.1s4.1 1.1 5.3 3.1"/></th:block></th:block></svg>

</body>
</html>

name: Validar migração Java e HTML
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_DB: saas_teste
          POSTGRES_PASSWORD: postgres-ci
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      TESTE_PG_PRODUTOS: '1'
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: saas_teste
      PGPASSWORD: postgres-ci
      SAAS_APP_DB_PASSWORD: senha-local-do-teste
      TESTE_JDBC_URL: jdbc:postgresql://localhost:5432/saas_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar banco descartável com as migrations do sistema
        run: |
          for arquivo in apps/api/prisma/migrations/*/migration.sql; do
            psql -X --set=ON_ERROR_STOP=1 --file="$arquivo"
          done
          psql -X --set=ON_ERROR_STOP=1 -c "ALTER ROLE saas_app LOGIN PASSWORD '$SAAS_APP_DB_PASSWORD'"
      - run: mvn -B -f apps/java/pom.xml test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:core
      - name: Validar os contratos de cadastro da API original no banco de testes
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres-ci@localhost:5432/postgres
        run: npm test -w @saas/api -- --runTestsByPath test/codigos.spec.ts
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:core
      - run: node --test apps/web/html/paridade.test.js
      - run: npm test -w @saas/web
      - run: npm run build -w @saas/web
      - run: npm exec -w @saas/web -- vite build --config html/vite.config.js
      - name: Preparar referência visual da branch principal
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: referencia-visual
          persist-credentials: false
      - name: Comparar as telas de produtos em 390 e 1280 pixels
        if: github.event_name == 'pull_request'
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" referencia-visual/node_modules
          export COMPARADOR="$RUNNER_TEMP/comparador"
          npm install --prefix "$COMPARADOR" playwright-core@1.56.1 --ignore-scripts
          node apps/web/test/comparar-produtos.mjs referencia-visual "$RUNNER_TEMP/fotos"
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'pull_request'
        with:
          name: comparacao-de-produtos
          path: ${{ runner.temp }}/fotos

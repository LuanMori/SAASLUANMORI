# apps/web/nginx/proxy_api.conf — como o nginx repassa /api para a API.
proxy_http_version 1.1;
# a API acha a loja pelo endereço (Host) e o IP real pelo X-Forwarded-For (SALTOS_DE_PROXY=1).
# $http_host (com a porta, como o navegador mandou): a API compara com a Origin do pedido.
proxy_set_header Host $http_host;
# o IP que o nginx vê, e SÓ ele: um X-Forwarded-For inventado por quem acessa é descartado
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host "";
# o mesmo id nos logs do nginx e da API
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# apps/web/nginx/seguranca.conf — cabeçalhos de segurança (item 5.2 da revisão de 18/11/2026).
# Incluído em cada location que tem add_header próprio (no nginx, um add_header na location
# apaga os herdados do server: por isso fica neste arquivo, e não solto no server).
#   CSP: só scripts, estilos e chamadas do próprio endereço; ninguém põe o sistema num <iframe>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS: o navegador passa a usar só HTTPS neste endereço. Vale quando o HTTPS termina na frente do
# nginx (Cloudflare, balanceador ou Caddy) — e aí o http:// nem deveria chegar aqui.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

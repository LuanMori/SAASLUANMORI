# apps/web/nginx/default.conf — a tela (arquivos do build) e /api repassado para a API.
# Na frente deste nginx fica o HTTPS (Cloudflare, balanceador ou Caddy): ver docs/deploy.md.

# Login (POST /api/sessao): no máximo 10 por minuto por IP, além do limite da própria API.
map $request_method $ip_do_login {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $ip_do_login zone=login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 200k;
  charset utf-8;

  include /etc/nginx/seguranca.conf;

  location = /api/sessao {
    limit_req zone=login burst=10 nodelay;
    include /etc/nginx/proxy_api.conf;
    proxy_pass http://api:3000/sessao;
  }

  location /api/ {
    include /etc/nginx/proxy_api.conf;
    proxy_pass http://api:3000/;
  }

  # arquivos com hash no nome: podem ficar no cache por um ano
  location /assets/ {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # a página em si: sempre a versão nova
  location / {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
